name: Liberacion del Sistema de Inventario

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  liberar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar .NET 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Ejecutar pruebas
        run: dotnet test tests/ProductoTests.csproj --verbosity normal

      - name: Instalar zip y crear paquete
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          zip -r sistema-inventario-${GITHUB_REF_NAME}.zip src/

      - name: Publicar version
        uses: softprops/action-gh-release@v2
        with:
          files: sistema-inventario-${{ github.ref_name }}.zip
          generate_release_notes: true